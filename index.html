<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q&A Creator</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
  rel="stylesheet"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  font-family: "Poppins", sans-serif;
  color: #20242c;
}

.container {
  width: 95%;
  max-width: 1100px;
  margin: 25px auto;
  background: #ffffff;
  padding: 22px;
  border-radius: 14px;
  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
}

/* =========================================================
   HEADER
========================================================= */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 20px;
}

.heading-input {
  width: 100%;
  max-width: 650px;
  height: 44px;
  border: 1px solid #d7dce5;
  border-radius: 9px;
  padding: 0 13px;
  font-family: inherit;
  font-size: 22px;
  font-weight: 600;
  color: #20242c;
  outline: none;
  background: #ffffff;
}

.heading-input:focus {
  border-color: #4f46e5;
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.08);
}

.heading-input::placeholder {
  color: #9ca3af;
  font-weight: 500;
}

/* =========================================================
   HISTORY BUTTON
========================================================= */

.history-btn {
  flex-shrink: 0;
  border: none;
  background: #111827;
  color: white;
  height: 40px;
  padding: 0 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  transition: 0.2s;
}

.history-btn:hover {
  background: #000000;
  transform: translateY(-1px);
}

/* =========================================================
   UPLOAD
========================================================= */

.upload-area {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.upload-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #eef2ff;
  color: #4338ca;
  border: 1px solid #c7d2fe;
  height: 38px;
  padding: 0 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
}

.upload-btn:hover {
  background: #e0e7ff;
}

#jsonUpload {
  display: none;
}

/* =========================================================
   QUESTION CARD
========================================================= */

.qa-card {
  background: #fafbfe;
  border: 1px solid #e1e5ec;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
  position: relative;
}

.qa-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.qa-title {
  font-size: 14px;
  font-weight: 600;
  color: #374151;
}

.delete-btn {
  border: none;
  background: #fee2e2;
  color: #dc2626;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

.delete-btn:hover {
  background: #fecaca;
}

/* =========================================================
   INPUTS
========================================================= */

.question-input,
.answer-input,
.code-input {
  width: 100%;
  border: 1px solid #d9dee8;
  border-radius: 7px;
  background: #ffffff;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  padding: 9px 11px;
  margin-bottom: 8px;
}

.question-input {
  height: 42px;
}

.answer-input,
.code-input {
  height: 65px;
  resize: vertical;
  overflow-y: auto;
}

.question-input:focus,
.answer-input:focus,
.code-input:focus {
  border-color: #6366f1;
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.08);
}

/* =========================================================
   BUTTONS
========================================================= */

.add-btn,
.submit-btn,
.restart-btn,
.download-btn,
.json-btn {
  height: 40px;
  border: none;
  border-radius: 8px;
  padding: 0 17px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  margin-top: 5px;
  margin-right: 7px;
}

.add-btn {
  background: #eef2ff;
  color: #4338ca;
}

.add-btn:hover {
  background: #e0e7ff;
}

.submit-btn {
  background: #4f46e5;
  color: white;
}

.submit-btn:hover {
  background: #4338ca;
}

.restart-btn {
  background: #fff1f2;
  color: #dc2626;
}

.restart-btn:hover {
  background: #ffe4e6;
}

.download-btn {
  background: #059669;
  color: white;
}

.download-btn:hover {
  background: #047857;
}

.json-btn {
  background: #2563eb;
  color: white;
}

.json-btn:hover {
  background: #1d4ed8;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

/* =========================================================
   OUTPUT
========================================================= */

.output-title {
  margin-top: 25px;
  margin-bottom: 12px;
  font-size: 18px;
}

.result-card {
  border: 1px solid #e1e5ec;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 12px;
  background: white;
}

.result-question {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
  color: #1f2937;
}

.result-answer {
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  margin-bottom: 10px;
  color: #4b5563;
}

/* =========================================================
   CODE
========================================================= */

.code-container {
  margin-top: 10px;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #293241;
  background: #0d1117;
}

.code-header {
  background: #161b22;
  color: #c9d1d9;
  padding: 7px 10px;
  font-size: 11px;
  font-weight: 500;
  border-bottom: 1px solid #30363d;
}

.code-container pre {
  margin: 0;
  max-height: 280px;
  overflow: auto;
}

.code-container code {
  font-size: 12px;
  line-height: 1.5;
  display: block;
  padding: 10px;
}

/* =========================================================
   DOWNLOAD POPUP
========================================================= */

.download-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 3000;
}

.download-box {
  width: 360px;
  background: white;
  border-radius: 14px;
  padding: 25px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
  text-align: center;
}

.download-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 7px;
}

.download-filename {
  font-size: 11px;
  color: #6b7280;
  word-break: break-all;
  margin-bottom: 18px;
}

.progress-track {
  height: 9px;
  width: 100%;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #4f46e5;
  transition: width 0.25s ease;
}

.progress-percent {
  margin-top: 9px;
  font-size: 13px;
  font-weight: 600;
}

.progress-status {
  font-size: 11px;
  color: #6b7280;
  margin-top: 5px;
}

/* =========================================================
   RESTART POPUP
========================================================= */

.restart-overlay,
.history-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.48);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.restart-box {
  width: 380px;
  max-width: 92%;
  background: white;
  border-radius: 15px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
}

.restart-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.restart-title {
  font-size: 18px;
  font-weight: 600;
}

.restart-message {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
  margin: 12px 0 20px;
}

.restart-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.restart-cancel,
.restart-confirm {
  border: none;
  height: 38px;
  padding: 0 15px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.restart-cancel {
  background: #f3f4f6;
  color: #374151;
}

.restart-confirm {
  background: #dc2626;
  color: white;
}

/* =========================================================
   HISTORY
========================================================= */

.history-box {
  width: 650px;
  max-width: 94%;
  max-height: 80vh;
  overflow: hidden;
  background: white;
  border-radius: 15px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 17px 20px;
  border-bottom: 1px solid #e5e7eb;
}

.history-title {
  font-size: 17px;
  font-weight: 600;
}

.history-close {
  border: none;
  background: #f3f4f6;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  cursor: pointer;
}

#historyList {
  padding: 15px;
  overflow-y: auto;
}

.history-item {
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 13px;
  margin-bottom: 10px;
  background: #fafafa;
}

.history-item-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.history-name {
  font-size: 14px;
  font-weight: 600;
  color: #111827;
}

.history-date {
  font-size: 11px;
  color: #6b7280;
  margin-top: 3px;
}

.history-count {
  font-size: 11px;
  color: #4f46e5;
  margin-top: 5px;
}

.history-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.restore-btn,
.history-delete-btn {
  height: 32px;
  border: none;
  border-radius: 6px;
  padding: 0 12px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
}

.restore-btn {
  background: #eef2ff;
  color: #4338ca;
}

.history-delete-btn {
  background: #fee2e2;
  color: #dc2626;
}

.empty-history {
  text-align: center;
  padding: 35px 15px;
  color: #9ca3af;
  font-size: 13px;
}

/* =========================================================
   PDF
========================================================= */

#pdfContainer {
  position: fixed;
  left: -10000px;
  top: 0;
  width: 800px;
  background: white;
}

.pdf-card {
  width: 760px;
  padding: 35px;
  background: white;
  font-family: Arial, sans-serif;
  color: #111827;
}

.pdf-title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 8px;
}

.pdf-subtitle {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 25px;
}

.pdf-question {
  font-size: 17px;
  font-weight: bold;
  margin-bottom: 14px;
}

.pdf-answer {
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  margin-bottom: 18px;
}

.pdf-code-label {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 7px;
}

.pdf-code {
  background: #f3f4f6;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  padding: 12px;
  font-family: Consolas, monospace;
  font-size: 11px;
  line-height: 1.5;
  white-space: pre-wrap;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

  .container {
    width: 96%;
    padding: 15px;
    margin: 12px auto;
  }

  .header {
    align-items: flex-start;
  }

  .heading-input {
    font-size: 18px;
    height: 40px;
  }

  .history-btn {
    height: 38px;
    padding: 0 11px;
  }

  .upload-area {
    flex-wrap: wrap;
  }

  .add-btn,
  .submit-btn,
  .restart-btn,
  .download-btn,
  .json-btn {
    margin-bottom: 5px;
  }

  .history-box {
    max-height: 90vh;
  }

  .history-item-header {
    flex-direction: column;
  }
}

</style>
</head>

<body>

<div class="container">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <div class="header">

    <!-- EDITABLE HEADING -->

    <input
      type="text"
      id="headingName"
      class="heading-input"
      placeholder="Enter Q&A heading..."
      value="Q&A Creator"
      autocomplete="off"
    >

    <!-- HISTORY TOP RIGHT -->

    <button
      class="history-btn"
      onclick="openHistory()"
    >
      🕘 History
    </button>

  </div>


  <!-- =====================================================
       UPLOAD
  ====================================================== -->

  <div class="upload-area">

    <label
      for="jsonUpload"
      class="upload-btn"
    >
      ⬆ Upload JSON
    </label>

    <input
      type="file"
      id="jsonUpload"
      accept=".json"
    >

  </div>


  <!-- =====================================================
       QUESTIONS
  ====================================================== -->

  <div id="groups"></div>


  <button
    class="add-btn"
    onclick="addGroup()"
  >
    + Add Question
  </button>

  <button
    class="submit-btn"
    onclick="submitData()"
  >
    Submit
  </button>

  <button
    class="restart-btn"
    onclick="openRestartPopup()"
  >
    ↻ Clear / Restart
  </button>


  <!-- =====================================================
       OUTPUT
  ====================================================== -->

  <h2 class="output-title">
    Submitted Q&A
  </h2>

  <div id="output"></div>


  <button
    id="pdfButton"
    class="download-btn"
    onclick="downloadPDF()"
  >
    Download PDF
  </button>

  <button
    id="jsonButton"
    class="json-btn"
    onclick="downloadJSON()"
  >
    Download JSON
  </button>

</div>


<!-- =======================================================
     PDF CONTAINER
======================================================== -->

<div id="pdfContainer"></div>


<!-- =======================================================
     DOWNLOAD POPUP
======================================================== -->

<div
  id="downloadOverlay"
  class="download-overlay"
>

  <div class="download-box">

    <div
      id="downloadTitle"
      class="download-title"
    >
      Preparing Download
    </div>

    <div
      id="downloadFilename"
      class="download-filename"
    ></div>

    <div class="progress-track">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

    <div
      id="progressPercent"
      class="progress-percent"
    >
      0%
    </div>

    <div
      id="progressStatus"
      class="progress-status"
    >
      Preparing...
    </div>

  </div>

</div>


<!-- =======================================================
     RESTART POPUP
======================================================== -->

<div
  id="restartOverlay"
  class="restart-overlay"
>

  <div class="restart-box">

    <div class="restart-icon">
      ⚠️
    </div>

    <div class="restart-title">
      Clear all data?
    </div>

    <div class="restart-message">

      Your current Q&A will be saved
      to History before the workspace
      is cleared.

      <br><br>

      You can restore it later from
      the History section.

    </div>

    <div class="restart-actions">

      <button
        class="restart-cancel"
        onclick="closeRestartPopup()"
      >
        Cancel
      </button>

      <button
        class="restart-confirm"
        onclick="confirmRestart()"
      >
        Save to History & Clear
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     HISTORY POPUP
======================================================== -->

<div
  id="historyOverlay"
  class="history-overlay"
>

  <div class="history-box">

    <div class="history-header">

      <div class="history-title">
        🕘 Q&A History
      </div>

      <button
        class="history-close"
        onclick="closeHistory()"
      >
        ✖
      </button>

    </div>

    <div id="historyList"></div>

  </div>

</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let questionCount = 0;

let finalData = [];

const HISTORY_KEY = "qaHistory";

const DRAFT_KEY = "qaDraft";

const HEADING_KEY = "qaHeading";


/* =========================================================
   HEADING
========================================================= */

const headingInput =
  document.getElementById("headingName");


headingInput.addEventListener(
  "input",
  function () {

    localStorage.setItem(
      HEADING_KEY,
      this.value.trim()
    );

    saveDraft();

  }
);


/* =========================================================
   GET HEADING
========================================================= */

function getHeading() {

  const heading =
    document
      .getElementById("headingName")
      .value
      .trim();


  return heading || "Q&A Creator";

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================================================
   ATTRIBUTE ESCAPE
========================================================= */

function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  const hours =
    String(now.getHours())
      .padStart(2, "0");

  const minutes =
    String(now.getMinutes())
      .padStart(2, "0");

  const seconds =
    String(now.getSeconds())
      .padStart(2, "0");

  return `${year}-${month}-${day}_${hours}-${minutes}-${seconds}`;

}


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(
  code,
  requestedLanguage = ""
) {

  const text =
    String(code || "").trim();

  const requested =
    String(requestedLanguage || "")
      .trim()
      .toLowerCase();


  if (!text) {
    return "Code";
  }


  if (
    requested === "javascript" ||
    requested === "js"
  ) {
    return "JavaScript";
  }


  if (
    requested === "typescript" ||
    requested === "ts"
  ) {
    return "TypeScript";
  }


  if (
    requested === "python" ||
    requested === "py"
  ) {
    return "Python";
  }


  if (requested === "java") {
    return "Java";
  }


  if (requested === "html") {
    return "HTML";
  }


  if (requested === "css") {
    return "CSS";
  }


  if (requested === "json") {
    return "JSON";
  }


  if (requested === "sql") {
    return "SQL";
  }


  /* Playwright */

  if (
    /page\.(goto|click|fill|locator|waitFor|screenshot|title|url|reload)/i.test(text) ||
    /page\.getBy(Role|Text|Label|Placeholder|TestId)/i.test(text) ||
    /getByRole|getByText|getByLabel|getByPlaceholder|getByTestId/i.test(text) ||
    /\bexpect\s*\(/i.test(text) ||
    /\btest\s*\(/i.test(text) ||
    /@playwright\/test/i.test(text) ||
    /\b(playwright|chromium|firefox|webkit|browser)\b/i.test(text)
  ) {
    return "Playwright";
  }


  /* TypeScript */

  if (
    /\b(interface|type)\s+\w+/i.test(text) ||
    /:\s*(string|number|boolean|any|unknown)\b/.test(text)
  ) {
    return "TypeScript";
  }


  /* Python */

  if (
    /\bdef\s+\w+\s*\(/.test(text) ||
    /\bfrom\s+\w+\s+import\b/.test(text) ||
    /\bprint\s*\(/.test(text)
  ) {
    return "Python";
  }


  /* Java */

  if (
    /\bpublic\s+(class|static|void)\b/.test(text) ||
    /\bSystem\.out\.println\b/.test(text)
  ) {
    return "Java";
  }


  /* HTML */

  if (
    /<!DOCTYPE\s+html>/i.test(text) ||
    /<html[\s>]/i.test(text) ||
    /<body[\s>]/i.test(text) ||
    /<div[\s>]/i.test(text)
  ) {
    return "HTML";
  }


  /* CSS */

  if (
    /[.#][\w-]+\s*\{[\s\S]*?:/.test(text)
  ) {
    return "CSS";
  }


  /* JSON */

  if (
    (text.startsWith("{") && text.endsWith("}")) ||
    (text.startsWith("[") && text.endsWith("]"))
  ) {

    try {

      JSON.parse(text);

      return "JSON";

    } catch {}

  }


  /* SQL */

  if (
    /\b(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP)\b/i.test(text)
  ) {
    return "SQL";
  }


  /* JavaScript */

  if (
    /\b(const|let|var|function)\b/.test(text) ||
    /=>/.test(text) ||
    /console\.log/.test(text)
  ) {
    return "JavaScript";
  }


  return "Code";

}


/* =========================================================
   HIGHLIGHT LANGUAGE
========================================================= */

function getHighlightLanguage(label) {

  const map = {

    Playwright: "javascript",

    JavaScript: "javascript",

    TypeScript: "typescript",

    Python: "python",

    Java: "java",

    HTML: "xml",

    CSS: "css",

    JSON: "json",

    SQL: "sql",

    Code: "plaintext"

  };

  return map[label] || "plaintext";

}


/* =========================================================
   CREATE CODE BLOCK
========================================================= */

function createCodeBlock(
  codeText,
  requestedLanguage = ""
) {

  const container =
    document.createElement("div");

  container.className =
    "code-container";


  const detectedLanguage =
    detectLanguage(
      codeText,
      requestedLanguage
    );


  const header =
    document.createElement("div");

  header.className =
    "code-header";

  header.textContent =
    `</> ${detectedLanguage}`;


  const pre =
    document.createElement("pre");


  const code =
    document.createElement("code");


  code.textContent =
    codeText;


  const highlightLanguage =
    getHighlightLanguage(
      detectedLanguage
    );


  code.className =
    `language-${highlightLanguage}`;


  pre.appendChild(code);

  container.appendChild(header);

  container.appendChild(pre);


  if (
    highlightLanguage !== "plaintext" &&
    typeof hljs !== "undefined"
  ) {

    hljs.highlightElement(code);

  }


  return container;

}


/* =========================================================
   SAVE DRAFT
========================================================= */

function saveDraft() {

  const cards =
    document.querySelectorAll(
      ".qa-card"
    );


  const data = [];


  cards.forEach(card => {

    const question =
      card
        .querySelector(".question-input")
        .value
        .trim();


    const answer =
      card
        .querySelector(".answer-input")
        .value
        .trim();


    const code =
      card
        .querySelector(".code-input")
        .value
        .trim();


    data.push({
      question,
      answer,
      code
    });

  });


  const draft = {

    heading:
      getHeading(),

    data

  };


  localStorage.setItem(
    DRAFT_KEY,
    JSON.stringify(draft)
  );

}


/* =========================================================
   ADD QUESTION
========================================================= */

function addGroup(data = {}) {

  questionCount++;


  const groups =
    document.getElementById(
      "groups"
    );


  const card =
    document.createElement("div");

  card.className =
    "qa-card";


  card.innerHTML = `

    <div class="qa-card-header">

      <div class="qa-title">
        Question ${questionCount}
      </div>

      <button
        class="delete-btn"
        title="Delete Question"
      >
        ✕
      </button>

    </div>

    <input
      type="text"
      class="question-input"
      placeholder="Enter your question"
      value="${escapeAttribute(
        data.question || ""
      )}"
    >

    <textarea
      class="answer-input"
      placeholder="Enter answer"
    >${escapeHtml(
      data.answer || ""
    )}</textarea>

    <textarea
      class="code-input"
      placeholder="Enter example code (optional)"
    >${escapeHtml(
      data.code || ""
    )}</textarea>

  `;


  groups.appendChild(card);


  card
    .querySelector(".delete-btn")
    .addEventListener(
      "click",
      function () {

        card.remove();

        updateTitles();

        saveDraft();

      }
    );


  card
    .querySelectorAll(
      "input, textarea"
    )
    .forEach(element => {

      element.addEventListener(
        "input",
        saveDraft
      );

    });


  saveDraft();

}


/* =========================================================
   UPDATE TITLES
========================================================= */

function updateTitles() {

  const cards =
    document.querySelectorAll(
      ".qa-card"
    );


  cards.forEach(
    (card, index) => {

      card.querySelector(
        ".qa-title"
      ).textContent =
        `Question ${index + 1}`;

    }
  );


  questionCount =
    cards.length;

}


/* =========================================================
   JSON UPLOAD
========================================================= */

document
  .getElementById("jsonUpload")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          try {

            const parsed =
              JSON.parse(
                e.target.result
              );


            let importedData =
              parsed;


            /*
              Supports:

              [
                {...}
              ]

              OR

              {
                heading: "...",
                data: [...]
              }
            */


            if (
              !Array.isArray(parsed) &&
              Array.isArray(parsed.data)
            ) {

              importedData =
                parsed.data;


              if (parsed.heading) {

                document.getElementById(
                  "headingName"
                ).value =
                  parsed.heading;

              }

            }


            if (
              !Array.isArray(
                importedData
              )
            ) {

              alert(
                "Invalid JSON format."
              );

              return;

            }


            document.getElementById(
              "groups"
            ).innerHTML = "";


            questionCount = 0;


            importedData.forEach(
              item =>
                addGroup(item)
            );


            saveDraft();


            alert(
              `${importedData.length} question(s) imported successfully.`
            );


          } catch(error) {

            console.error(error);

            alert(
              "Unable to read the JSON file.\n\nPlease check the JSON format."
            );

          }

        };


      reader.readAsText(file);

    }
  );


/* =========================================================
   SUBMIT
========================================================= */

function submitData() {

  const cards =
    document.querySelectorAll(
      ".qa-card"
    );


  finalData = [];


  cards.forEach(card => {

    const question =
      card
        .querySelector(".question-input")
        .value
        .trim();


    const answer =
      card
        .querySelector(".answer-input")
        .value
        .trim();


    const code =
      card
        .querySelector(".code-input")
        .value
        .trim();


    if (!question) {
      return;
    }


    const item = {

      question,

      answer

    };


    if (code) {

      item.code =
        code;

    }


    finalData.push(item);

  });


  if (!finalData.length) {

    alert(
      "Please enter at least one question before submitting."
    );

    return;

  }


  displayResults();

}


/* =========================================================
   DISPLAY RESULTS
========================================================= */

function displayResults() {

  const output =
    document.getElementById(
      "output"
    );


  output.innerHTML = "";


  const heading =
    document.createElement("div");

  heading.style.fontSize =
    "18px";

  heading.style.fontWeight =
    "600";

  heading.style.marginBottom =
    "15px";

  heading.style.color =
    "#111827";

  heading.textContent =
    getHeading();


  output.appendChild(
    heading
  );


  finalData.forEach(
    (item, index) => {

      const card =
        document.createElement("div");

      card.className =
        "result-card";


      const question =
        document.createElement("div");

      question.className =
        "result-question";

      question.textContent =
        `${index + 1}. ${item.question}`;


      const answer =
        document.createElement("div");

      answer.className =
        "result-answer";

      answer.textContent =
        item.answer ||
        "No answer provided.";


      card.appendChild(
        question
      );

      card.appendChild(
        answer
      );


      if (item.code) {

        card.appendChild(
          createCodeBlock(
            item.code
          )
        );

      }


      output.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   HISTORY
========================================================= */

function getHistory() {

  try {

    const history =
      localStorage.getItem(
        HISTORY_KEY
      );


    if (!history) {
      return [];
    }


    const parsed =
      JSON.parse(history);


    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];

  }

}


/* =========================================================
   SAVE CURRENT TO HISTORY
========================================================= */

function saveCurrentToHistory() {

  const cards =
    document.querySelectorAll(
      ".qa-card"
    );


  const data = [];


  cards.forEach(card => {

    const question =
      card
        .querySelector(".question-input")
        .value
        .trim();


    const answer =
      card
        .querySelector(".answer-input")
        .value
        .trim();


    const code =
      card
        .querySelector(".code-input")
        .value
        .trim();


    if (question) {

      const item = {

        question,

        answer

      };


      if (code) {

        item.code =
          code;

      }


      data.push(item);

    }

  });


  if (!data.length) {

    return false;

  }


  const history =
    getHistory();


  const session = {

    id:
      Date.now(),

    date:
      new Date().toISOString(),

    heading:
      getHeading(),

    questionCount:
      data.length,

    data

  };


  history.unshift(
    session
  );


  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(
      history.slice(0, 20)
    )
  );


  return true;

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatHistoryDate(
  dateString
) {

  try {

    return new Date(
      dateString
    ).toLocaleString(
      "en-IN",
      {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  } catch {

    return dateString;

  }

}


/* =========================================================
   OPEN HISTORY
========================================================= */

function openHistory() {

  renderHistory();


  document.getElementById(
    "historyOverlay"
  ).style.display =
    "flex";

}


/* =========================================================
   CLOSE HISTORY
========================================================= */

function closeHistory() {

  document.getElementById(
    "historyOverlay"
  ).style.display =
    "none";

}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory() {

  const history =
    getHistory();


  const list =
    document.getElementById(
      "historyList"
    );


  list.innerHTML = "";


  if (!history.length) {

    list.innerHTML = `

      <div class="empty-history">

        No Q&A history available.

        <br><br>

        Previous sessions will appear
        here when you use
        Clear / Restart.

      </div>

    `;

    return;

  }


  history.forEach(
    (session, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      item.innerHTML = `

        <div class="history-item-header">

          <div>

            <div class="history-name">

              ${escapeHtml(
                session.heading ||
                "Q&A Creator"
              )}

            </div>

            <div class="history-date">

              ${escapeHtml(
                formatHistoryDate(
                  session.date
                )
              )}

            </div>

            <div class="history-count">

              ${session.questionCount || 0}
              Question(s)

            </div>

          </div>

        </div>

        <div class="history-actions">

          <button
            class="restore-btn"
            onclick="restoreHistory(${session.id})"
          >
            ↻ Restore
          </button>

          <button
            class="history-delete-btn"
            onclick="deleteHistory(${session.id})"
          >
            🗑 Delete
          </button>

        </div>

      `;


      list.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   RESTORE HISTORY
========================================================= */

function restoreHistory(
  historyId
) {

  const history =
    getHistory();


  const session =
    history.find(
      item =>
        item.id === historyId
    );


  if (!session) {

    alert(
      "History session not found."
    );

    return;

  }


  const confirmed =
    confirm(
      "Restore this Q&A session?\n\nYour current workspace will be replaced."
    );


  if (!confirmed) {
    return;
  }


  document.getElementById(
    "groups"
  ).innerHTML = "";


  questionCount = 0;


  /* Restore heading */

  document.getElementById(
    "headingName"
  ).value =
    session.heading ||
    "Q&A Creator";


  /* Restore questions */

  session.data.forEach(
    item =>
      addGroup(item)
  );


  finalData = [];


  document.getElementById(
    "output"
  ).innerHTML = "";


  saveDraft();


  closeHistory();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  alert(
    "Q&A session restored successfully."
  );

}


/* =========================================================
   DELETE HISTORY
========================================================= */

function deleteHistory(
  historyId
) {

  const confirmed =
    confirm(
      "Delete this history session?\n\nThis action cannot be undone."
    );


  if (!confirmed) {
    return;
  }


  const history =
    getHistory().filter(
      item =>
        item.id !== historyId
    );


  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );


  renderHistory();

}


/* =========================================================
   RESTART
========================================================= */

function openRestartPopup() {

  document.getElementById(
    "restartOverlay"
  ).style.display =
    "flex";

}


function closeRestartPopup() {

  document.getElementById(
    "restartOverlay"
  ).style.display =
    "none";

}


function confirmRestart() {

  const savedToHistory =
    saveCurrentToHistory();


  localStorage.removeItem(
    DRAFT_KEY
  );


  document.getElementById(
    "groups"
  ).innerHTML = "";


  document.getElementById(
    "output"
  ).innerHTML = "";


  questionCount = 0;

  finalData = [];


  document.getElementById(
    "jsonUpload"
  ).value = "";


  /*
    Keep the current heading.
    Only Q&A content is cleared.
  */

  addGroup();


  closeRestartPopup();


  if (savedToHistory) {

    alert(
      "Current Q&A has been saved to History.\n\nA fresh Q&A session has been started."
    );

  } else {

    alert(
      "Workspace cleared.\n\nA fresh Q&A session has been started."
    );

  }

}


/* =========================================================
   DOWNLOAD PROGRESS
========================================================= */

function showDownloadProgress(
  title,
  filename
) {

  document.getElementById(
    "downloadTitle"
  ).textContent =
    title;


  document.getElementById(
    "downloadFilename"
  ).textContent =
    filename;


  document.getElementById(
    "progressBar"
  ).style.width =
    "0%";


  document.getElementById(
    "progressPercent"
  ).textContent =
    "0%";


  document.getElementById(
    "progressStatus"
  ).textContent =
    "Preparing...";


  document.getElementById(
    "downloadOverlay"
  ).style.display =
    "flex";

}


function updateDownloadProgress(
  percent,
  status
) {

  document.getElementById(
    "progressBar"
  ).style.width =
    `${percent}%`;


  document.getElementById(
    "progressPercent"
  ).textContent =
    `${percent}%`;


  document.getElementById(
    "progressStatus"
  ).textContent =
    status;

}


function hideDownloadProgress(
  success = false
) {

  if (success) {

    updateDownloadProgress(
      100,
      "Download completed successfully."
    );

  }


  setTimeout(
    () => {

      document.getElementById(
        "downloadOverlay"
      ).style.display =
        "none";

    },
    success ? 700 : 0
  );

}


function setDownloadButtons(
  disabled
) {

  document.getElementById(
    "pdfButton"
  ).disabled =
    disabled;


  document.getElementById(
    "jsonButton"
  ).disabled =
    disabled;

}


/* =========================================================
   DOWNLOAD JSON
========================================================= */

async function downloadJSON() {

  if (!finalData.length) {

    alert(
      "Please click Submit before downloading JSON."
    );

    return;

  }


  const timestamp =
    getTimestamp();


  /*
    Filename remains unchanged.
  */

  const filename =
    `QA_Data_${timestamp}.json`;


  showDownloadProgress(
    "Preparing JSON",
    filename
  );


  setDownloadButtons(true);


  try {

    updateDownloadProgress(
      20,
      "Preparing Q&A data..."
    );


    await delay(250);


    const exportData = {

      heading:
        getHeading(),

      exportedAt:
        new Date().toISOString(),

      totalQuestions:
        finalData.length,

      data:
        finalData

    };


    updateDownloadProgress(
      50,
      "Creating JSON file..."
    );


    await delay(250);


    const blob =
      new Blob(
        [
          JSON.stringify(
            exportData,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );


    updateDownloadProgress(
      80,
      "Starting download..."
    );


    await delay(250);


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      url;

    link.download =
      filename;


    document.body.appendChild(
      link
    );

    link.click();

    link.remove();


    URL.revokeObjectURL(
      url
    );


    hideDownloadProgress(
      true
    );


  } catch(error) {

    console.error(error);

    hideDownloadProgress();

    alert(
      "Unable to download JSON."
    );

  } finally {

    setDownloadButtons(
      false
    );

  }

}


/* =========================================================
   DOWNLOAD PDF
========================================================= */

async function downloadPDF() {

  if (!finalData.length) {

    alert(
      "Please click Submit before downloading PDF."
    );

    return;

  }


  const timestamp =
    getTimestamp();


  /*
    Filename remains unchanged.
  */

  const filename =
    `QA_Report_${timestamp}.pdf`;


  showDownloadProgress(
    "Preparing PDF",
    filename
  );


  setDownloadButtons(true);


  const pdfContainer =
    document.getElementById(
      "pdfContainer"
    );


  pdfContainer.innerHTML = "";


  try {

    const {
      jsPDF
    } = window.jspdf;


    const pdf =
      new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4"
      });


    const pageWidth =
      pdf.internal.pageSize.getWidth();


    const pageHeight =
      pdf.internal.pageSize.getHeight();


    const margin = 10;


    const usableWidth =
      pageWidth -
      margin * 2;


    for (
      let index = 0;
      index < finalData.length;
      index++
    ) {

      const item =
        finalData[index];


      updateDownloadProgress(
        Math.round(
          (index /
            finalData.length) *
            90
        ),
        `Generating question ${index + 1} of ${finalData.length}...`
      );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "pdf-card";


      /*
        Editable heading
        appears inside PDF.
      */

      const title =
        document.createElement(
          "div"
        );


      title.className =
        "pdf-title";


      title.textContent =
        getHeading();


      const subtitle =
        document.createElement(
          "div"
        );


      subtitle.className =
        "pdf-subtitle";


      subtitle.textContent =
        `Question ${index + 1} of ${finalData.length}`;


      const question =
        document.createElement(
          "div"
        );


      question.className =
        "pdf-question";


      question.textContent =
        `${index + 1}. ${item.question}`;


      const answer =
        document.createElement(
          "div"
        );


      answer.className =
        "pdf-answer";


      answer.textContent =
        item.answer ||
        "No answer provided.";


      card.appendChild(
        title
      );


      card.appendChild(
        subtitle
      );


      card.appendChild(
        question
      );


      card.appendChild(
        answer
      );


      if (item.code) {

        const codeLabel =
          document.createElement(
            "div"
          );


        codeLabel.className =
          "pdf-code-label";


        codeLabel.textContent =
          `Example Code — ${detectLanguage(
            item.code
          )}`;


        const code =
          document.createElement(
            "div"
          );


        code.className =
          "pdf-code";


        code.textContent =
          item.code;


        card.appendChild(
          codeLabel
        );


        card.appendChild(
          code
        );

      }


      pdfContainer.appendChild(
        card
      );


      await delay(20);


      const canvas =
        await html2canvas(
          card,
          {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff"
          }
        );


      const imageData =
        canvas.toDataURL(
          "image/png"
        );


      const imageWidth =
        usableWidth;


      let imageHeight =
        (canvas.height /
          canvas.width) *
        imageWidth;


      if (index > 0) {

        pdf.addPage();

      }


      const maxHeight =
        pageHeight -
        margin * 2;


      if (
        imageHeight >
        maxHeight
      ) {

        const scale =
          maxHeight /
          imageHeight;


        imageHeight *=
          scale;

      }


      pdf.addImage(
        imageData,
        "PNG",
        margin,
        margin,
        imageWidth,
        imageHeight
      );

    }


    updateDownloadProgress(
      95,
      "Saving PDF..."
    );


    await delay(300);


    pdf.save(
      filename
    );


    updateDownloadProgress(
      100,
      "PDF downloaded successfully."
    );


    hideDownloadProgress(
      true
    );


  } catch(error) {

    console.error(
      "PDF Error:",
      error
    );


    hideDownloadProgress();


    alert(
      "Unable to generate PDF.\n\nPlease check the browser console for details."
    );

  } finally {

    pdfContainer.innerHTML = "";

    setDownloadButtons(
      false
    );

  }

}


/* =========================================================
   DELAY
========================================================= */

function delay(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   OVERLAY CLICK
========================================================= */

document
  .getElementById(
    "historyOverlay"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeHistory();

      }

    }
  );


document
  .getElementById(
    "restartOverlay"
  )
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeRestartPopup();

      }

    }
  );


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeHistory();

      closeRestartPopup();

    }

  }
);


/* =========================================================
   LOAD SAVED DATA
========================================================= */

window.addEventListener(
  "load",
  function() {

    /*
      Restore saved heading.
    */

    const savedHeading =
      localStorage.getItem(
        HEADING_KEY
      );


    if (savedHeading) {

      document.getElementById(
        "headingName"
      ).value =
        savedHeading;

    }


    /*
      Restore draft.
    */

    try {

      const savedDraft =
        localStorage.getItem(
          DRAFT_KEY
        );


      if (savedDraft) {

        const draft =
          JSON.parse(
            savedDraft
          );


        if (
          draft.heading
        ) {

          document.getElementById(
            "headingName"
          ).value =
            draft.heading;

        }


        if (
          Array.isArray(
            draft.data
          ) &&
          draft.data.length
        ) {

          draft.data.forEach(
            item =>
              addGroup(item)
          );


          return;

        }

      }

    } catch(error) {

      console.error(
        "Draft loading error:",
        error
      );

    }


    /*
      Default question.
    */

    addGroup();

  }
);
