<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q&A Creator</title>


<!-- =====================================================
     GOOGLE FONT
====================================================== -->

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
>


<!-- =====================================================
     PDF LIBRARIES
====================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<!-- =====================================================
     HIGHLIGHT.JS
====================================================== -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js">
</script>


<style>

/* =====================================================
   GLOBAL
====================================================== */

:root {

    --primary: #6c63ff;

    --bg: #f4f6fb;

    --border: #dddddd;

    --text: #222222;

}


* {
    box-sizing: border-box;
}


body {

    font-family: Poppins, sans-serif;

    background: var(--bg);

    margin: 0;

    padding: 15px;

    color: var(--text);

}


.container {

    max-width: 1000px;

    margin: auto;

}


/* =====================================================
   HEADINGS
====================================================== */

h2 {

    font-size: 21px;

    margin: 8px 0 15px;

}


/* =====================================================
   QUESTION CARD
====================================================== */

.card {

    background: #ffffff;

    padding: 12px 14px;

    margin-bottom: 10px;

    border-radius: 9px;

    border: 1px solid #e5e5e5;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.05);

    position: relative;

    overflow: hidden;

}


/* =====================================================
   QUESTION TITLE
====================================================== */

.title {

    font-size: 14px;

    font-weight: 600;

    color: var(--primary);

    margin-bottom: 5px;

    padding-right: 40px;

    line-height: 1.4;

}


/* =====================================================
   INPUT / TEXTAREA
====================================================== */

input,
textarea {

    width: 100%;

    max-width: 100%;

    padding: 8px 10px;

    margin-top: 6px;

    border-radius: 7px;

    border: 1px solid var(--border);

    font-family: Poppins, sans-serif;

    font-size: 13px;

    line-height: 1.4;

    background: #ffffff;

    color: #222222;

    outline: none;

}


input {

    height: 37px;

}


textarea {

    height: 65px;

    min-height: 65px;

    max-height: 65px;

    resize: none;

    overflow-y: auto;

    overflow-x: hidden;

}


/* =====================================================
   TEXTAREA SCROLLBAR
====================================================== */

textarea::-webkit-scrollbar {

    width: 6px;

}


textarea::-webkit-scrollbar-track {

    background: #f1f1f1;

}


textarea::-webkit-scrollbar-thumb {

    background: #b5b5b5;

    border-radius: 5px;

}


/* =====================================================
   INPUT FOCUS
====================================================== */

input:focus,
textarea:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 0 2px rgba(108, 99, 255, 0.10);

}


/* =====================================================
   BUTTONS
====================================================== */

button {

    padding: 8px 14px;

    border: none;

    border-radius: 7px;

    cursor: pointer;

    margin-top: 8px;

    font-family: Poppins, sans-serif;

    font-size: 13px;

    transition: 0.2s;

}


button:hover {

    transform: translateY(-1px);

}


button:disabled {

    opacity: 0.6;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   MAIN BUTTONS
====================================================== */

.add-btn {

    background: #6c63ff;

    color: white;

}


.submit-btn {

    background: #28a745;

    color: white;

}


.download-btn {

    background: #ff5722;

    color: white;

}


.json-btn {

    background: #009688;

    color: white;

}


.restart-btn {

    background: #dc3545;

    color: white;

}


.restart-btn:hover {

    background: #c82333;

}


/* =====================================================
   HISTORY BUTTON
====================================================== */

.history-btn {

    background: #495057;

    color: white;

    margin-left: 6px;

}


.history-btn:hover {

    background: #343a40;

}


/* =====================================================
   DELETE QUESTION
====================================================== */

.cancel-btn {

    position: absolute;

    top: 9px;

    right: 10px;

    width: 27px;

    height: 27px;

    padding: 0;

    margin: 0;

    background: #ff2d2d;

    color: white;

    border-radius: 50%;

    font-size: 11px;

    font-weight: bold;

    display: flex;

    align-items: center;

    justify-content: center;

}


.cancel-btn:hover {

    background: #d90000;

}


/* =====================================================
   UPLOAD
====================================================== */

.upload-area {

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    flex-wrap: wrap;

}


.upload-btn {

    display: inline-block;

    background:
        linear-gradient(
            135deg,
            #6c63ff,
            #8f88ff
        );

    color: white;

    padding: 8px 15px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 500;

}


.upload-btn:hover {

    transform: translateY(-1px);

}


#jsonUpload {

    display: none;

}


/* =====================================================
   ANSWER
====================================================== */

.answer-text {

    white-space: pre-wrap;

    word-break: break-word;

    overflow-wrap: break-word;

    font-size: 13px;

    line-height: 1.5;

}


/* =====================================================
   CODE CONTAINER
====================================================== */

.code-container {

    margin-top: 8px;

    border-radius: 8px;

    overflow: hidden;

    background: #1e1e1e;

    border: 1px solid #2d2d2d;

}


/* =====================================================
   CODE HEADER
====================================================== */

.code-header {

    height: 32px;

    display: flex;

    align-items: center;

    padding: 0 12px;

    background: #252526;

    color: #ffffff;

    font-size: 11px;

    font-weight: 500;

    border-bottom: 1px solid #333333;

}


.code-icon {

    margin-right: 7px;

    color: #cccccc;

}


.code-language {

    color: #ffffff;

    font-weight: 600;

}


/* =====================================================
   CODE AREA
====================================================== */

.code-container pre {

    margin: 0;

    padding: 12px;

    background: #1e1e1e;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-break: break-word;

    overflow-wrap: break-word;

    max-height: 220px;

    overflow-y: auto;

    overflow-x: auto;

}


.code-container pre code {

    display: block;

    padding: 0;

    background: transparent;

    color: #e6e6e6;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 12px;

    line-height: 1.6;

}


.code-container pre code.hljs {

    background: transparent;

    color: #e6e6e6;

}


.code-container pre code.language-plaintext {

    color: #e6e6e6 !important;

}


/* =====================================================
   CODE SCROLLBAR
====================================================== */

.code-container pre::-webkit-scrollbar {

    width: 6px;

    height: 6px;

}


.code-container pre::-webkit-scrollbar-track {

    background: #1e1e1e;

}


.code-container pre::-webkit-scrollbar-thumb {

    background: #555555;

    border-radius: 5px;

}


/* =====================================================
   PDF CONTAINER
====================================================== */

#pdfContainer {

    position: absolute;

    left: -10000px;

    top: 0;

    width: 800px;

    background: #ffffff;

}


/* =====================================================
   PDF CARD
====================================================== */

.pdf-card {

    background: #ffffff;

    padding: 18px;

    margin-bottom: 15px;

    border: 1px solid #dddddd;

    border-radius: 8px;

    width: 800px;

}


.pdf-title {

    font-size: 18px;

    font-weight: 600;

    color: #6c63ff;

    margin-bottom: 10px;

    line-height: 1.4;

}


.pdf-answer {

    font-size: 13px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-break: break-word;

    overflow-wrap: break-word;

}


.pdf-card .code-container pre {

    max-height: none;

    overflow: visible;

}


/* =====================================================
   DOWNLOAD OVERLAY
====================================================== */

.download-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

}


.download-overlay.show {

    display: flex;

}


.download-box {

    width: 360px;

    max-width: 90%;

    background: #ffffff;

    border-radius: 12px;

    padding: 22px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);

    text-align: center;

}


.download-title {

    font-size: 16px;

    font-weight: 600;

    color: #333333;

    margin-bottom: 5px;

}


.download-filename {

    font-size: 11px;

    color: #777777;

    margin-bottom: 15px;

    word-break: break-all;

}


.progress-track {

    width: 100%;

    height: 9px;

    background: #eeeeee;

    border-radius: 10px;

    overflow: hidden;

}


.progress-bar {

    width: 0%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #6c63ff,
            #8f88ff
        );

    border-radius: 10px;

    transition: width 0.2s ease;

}


.progress-percent {

    margin-top: 10px;

    font-size: 14px;

    font-weight: 600;

    color: #6c63ff;

}


.progress-status {

    margin-top: 5px;

    font-size: 11px;

    color: #777777;

}


.download-success {

    color: #28a745;

    font-weight: 600;

}


/* =====================================================
   RESTART POPUP
====================================================== */

.restart-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 10000;

}


.restart-overlay.show {

    display: flex;

}


.restart-box {

    width: 380px;

    max-width: 90%;

    background: #ffffff;

    border-radius: 12px;

    padding: 24px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);

    text-align: center;

}


.restart-icon {

    font-size: 32px;

    margin-bottom: 8px;

}


.restart-title {

    font-size: 17px;

    font-weight: 600;

    color: #222222;

    margin-bottom: 8px;

}


.restart-message {

    font-size: 12px;

    color: #666666;

    line-height: 1.5;

    margin-bottom: 18px;

}


.restart-actions {

    display: flex;

    justify-content: center;

    gap: 10px;

}


.restart-cancel {

    background: #6c757d;

    color: white;

    margin: 0;

}


.restart-confirm {

    background: #dc3545;

    color: white;

    margin: 0;

}


/* =====================================================
   HISTORY POPUP
====================================================== */

.history-overlay {

    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 11000;

}


.history-overlay.show {

    display: flex;

}


.history-box {

    width: 600px;

    max-width: 92%;

    max-height: 80vh;

    background: white;

    border-radius: 12px;

    padding: 20px;

    box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);

    overflow-y: auto;

}


.history-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;

}


.history-title {

    font-size: 18px;

    font-weight: 600;

    color: #222222;

}


.history-close {

    width: 30px;

    height: 30px;

    padding: 0;

    margin: 0;

    border-radius: 50%;

    background: #dc3545;

    color: white;

}


/* =====================================================
   HISTORY ITEM
====================================================== */

.history-item {

    border: 1px solid #e1e1e1;

    border-radius: 9px;

    padding: 12px;

    margin-bottom: 10px;

    background: #fafafa;

}


.history-item-title {

    font-size: 13px;

    font-weight: 600;

    color: #6c63ff;

    margin-bottom: 4px;

}


.history-item-info {

    font-size: 11px;

    color: #777777;

    margin-bottom: 10px;

}


.history-actions {

    display: flex;

    gap: 7px;

}


.history-restore {

    background: #28a745;

    color: white;

    margin: 0;

    font-size: 11px;

}


.history-delete {

    background: #dc3545;

    color: white;

    margin: 0;

    font-size: 11px;

}


.history-empty {

    text-align: center;

    padding: 30px 10px;

    color: #777777;

    font-size: 13px;

}


/* =====================================================
   MOBILE
====================================================== */

@media (max-width: 600px) {

    body {

        padding: 10px;

    }


    .card {

        padding: 11px;

    }


    input,
    textarea {

        font-size: 12px;

    }


    .download-box,
    .restart-box {

        width: 320px;

    }

}


/* =====================================================
   SIDEBAR (NEW) - ChatGPT style "Recents"
====================================================== */

body {

    padding-left: 275px;

    transition: padding-left 0.25s ease;

}


body.sidebar-closed {

    padding-left: 60px;

}


.sidebar {

    position: fixed;

    top: 0;

    left: 0;

    bottom: 0;

    width: 260px;

    background: #181818;

    color: #ececec;

    display: flex;

    flex-direction: column;

    z-index: 9000;

    transition: transform 0.25s ease;

    border-right: 1px solid #2a2a2a;

}


body.sidebar-closed .sidebar {

    transform: translateX(-100%);

}


.sidebar-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 18px 16px 10px;

}


.sidebar-brand {

    font-size: 18px;

    font-weight: 600;

    color: #ffffff;

}


.sidebar-icon-btn {

    width: 34px;

    height: 34px;

    padding: 0;

    margin: 0;

    background: transparent;

    color: #cfcfcf;

    border-radius: 8px;

    font-size: 16px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.sidebar-icon-btn:hover {

    background: #2a2a2a;

    transform: none;

}


.sidebar-new {

    margin: 8px 12px 10px;

    padding: 10px 12px;

    width: calc(100% - 24px);

    background: #262626;

    color: #ffffff;

    border-radius: 10px;

    font-size: 14px;

    font-weight: 500;

    display: flex;

    align-items: center;

    gap: 10px;

    text-align: left;

}


.sidebar-new:hover {

    background: #303030;

    transform: none;

}


.sidebar-section {

    padding: 12px 18px 6px;

    font-size: 13px;

    font-weight: 500;

    color: #8e8e8e;

    border-top: 1px solid #2a2a2a;

}


.sidebar-list {

    flex: 1;

    overflow-y: auto;

    padding: 0 8px 14px;

}


.sidebar-list::-webkit-scrollbar {

    width: 6px;

}


.sidebar-list::-webkit-scrollbar-thumb {

    background: #444444;

    border-radius: 5px;

}


.sidebar-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 6px;

    padding: 9px 10px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    color: #e4e4e4;

}


.sidebar-item:hover {

    background: #2a2a2a;

}


.sidebar-item-title {

    flex: 1;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.sidebar-item-delete {

    width: 26px;

    height: 26px;

    padding: 0;

    margin: 0;

    background: transparent;

    color: #9a9a9a;

    border-radius: 6px;

    font-size: 13px;

    display: none;

    align-items: center;

    justify-content: center;

    flex-shrink: 0;

}


.sidebar-item:hover .sidebar-item-delete {

    display: flex;

}


.sidebar-item-delete:hover {

    background: #3a3a3a;

    color: #ff6b6b;

    transform: none;

}


.sidebar-empty {

    padding: 18px 12px;

    font-size: 13px;

    color: #8e8e8e;

    line-height: 1.5;

}


.sidebar-open-btn {

    position: fixed;

    top: 12px;

    left: 12px;

    width: 38px;

    height: 38px;

    padding: 0;

    margin: 0;

    background: #181818;

    color: #ffffff;

    border-radius: 9px;

    font-size: 17px;

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 8999;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);

}


body.sidebar-closed .sidebar-open-btn {

    display: flex;

}


.sidebar-backdrop {

    display: none;

}


@media (max-width: 800px) {

    body,
    body.sidebar-closed {

        padding-left: 58px;

    }


    .sidebar-item-delete {

        display: flex;

    }


    body:not(.sidebar-closed) .sidebar-backdrop {

        display: block;

        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.45);

        z-index: 8998;

    }

}

/* =====================================================
   HISTORY ICON + TOOLTIP (NEW)
====================================================== */

.sidebar-header-actions {

    display: flex;

    align-items: center;

    gap: 2px;

}


.sidebar-list {

    margin-top: 4px;

}


.sidebar-open-history {

    top: 58px;

}


.tip {

    position: relative;

}


.tip::after {

    content: attr(data-tip);

    position: absolute;

    top: calc(100% + 8px);

    left: 50%;

    transform: translateX(-50%);

    background: #000000;

    color: #ffffff;

    font-size: 12px;

    font-weight: 500;

    padding: 5px 9px;

    border-radius: 7px;

    white-space: nowrap;

    pointer-events: none;

    opacity: 0;

    transition: opacity 0.15s ease;

    z-index: 12500;

}


.tip:hover::after {

    opacity: 1;

}


.sidebar-header-actions .tip:last-child::after {

    left: auto;

    right: 0;

    transform: none;

}


.sidebar-open-history::after,
.sidebar-open-btn.tip::after {

    left: 0;

    transform: none;

}


/* =====================================================
   CONFIRM POPUP (NEW) - uses restart popup look
====================================================== */

#confirmOverlay {

    z-index: 12000;

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR (NEW)
====================================================== -->

<div
    id="sidebarBackdrop"
    class="sidebar-backdrop"
    onclick="toggleSidebar()"
></div>


<button
    class="sidebar-open-btn"
    onclick="toggleSidebar()"
    title="Open sidebar"
>
    ☰
</button>



<aside
    id="sidebar"
    class="sidebar"
>

    <div class="sidebar-header">

        <div class="sidebar-brand">
            Q&A Creator
        </div>

        <div class="sidebar-header-actions">

            <button
                class="sidebar-icon-btn tip"
                data-tip="History"
                aria-label="History"
                onclick="openHistory()"
            >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline></svg>
            </button>

            <button
                class="sidebar-icon-btn tip"
                data-tip="Close sidebar"
                aria-label="Close sidebar"
                onclick="toggleSidebar()"
            >
                ◧
            </button>

        </div>

    </div>


    <button
        class="sidebar-new"
        onclick="openRestartPopup()"
    >
        ✎ New chat
    </button>




    <div
        id="sidebarList"
        class="sidebar-list"
    ></div>

</aside>


<div class="container">


<!-- =====================================================
     TITLE
====================================================== -->

<h2>Q&A Creator</h2>


<!-- =====================================================
     UPLOAD + HISTORY
====================================================== -->

<div class="upload-area">

    <label
        for="jsonUpload"
        class="upload-btn"
    >
        ⬆ Upload JSON
    </label>


    <input
        type="file"
        id="jsonUpload"
        accept=".json"
    >



</div>


<!-- =====================================================
     QUESTIONS
====================================================== -->

<div id="groups"></div>


<!-- =====================================================
     ACTION BUTTONS
====================================================== -->

<button
    class="add-btn"
    onclick="addGroup()"
>
    + Add Question
</button>


<button
    class="submit-btn"
    onclick="submitData()"
>
    Submit
</button>


<button
    class="restart-btn"
    onclick="openRestartPopup()"
>
    ↻ Clear / Restart
</button>


<!-- =====================================================
     OUTPUT
====================================================== -->

<h2>Submitted Q&A</h2>


<div id="output"></div>


<!-- =====================================================
     DOWNLOAD BUTTONS
====================================================== -->

<button
    id="pdfButton"
    class="download-btn"
    onclick="downloadPDF()"
>
    Download PDF
</button>


<button
    id="jsonButton"
    class="json-btn"
    onclick="downloadJSON()"
>
    Download JSON
</button>


</div>


<!-- =====================================================
     PDF CONTAINER
====================================================== -->

<div id="pdfContainer"></div>


<!-- =====================================================
     DOWNLOAD PROGRESS POPUP
====================================================== -->

<div
    id="downloadOverlay"
    class="download-overlay"
>

    <div class="download-box">

        <div
            id="downloadTitle"
            class="download-title"
        >
            Preparing download...
        </div>


        <div
            id="downloadFilename"
            class="download-filename"
        >
        </div>


        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-bar"
            >
            </div>

        </div>


        <div
            id="progressPercent"
            class="progress-percent"
        >
            0%
        </div>


        <div
            id="progressStatus"

<script>

/* =====================================================
   GLOBAL VARIABLES

let questionCount = 0;

let finalData = [];


/* =====================================================
   STORAGE KEY
====================================================== */

const HISTORY_KEY =

/* =====================================================
   LANGUAGE DETECTION
====================================================== */

function detectLanguage(
    code,
    requestedLanguage = ""
) {

    const text =
        String(code || "").trim();


    const requested =
        String(requestedLanguage || "")
            .toLowerCase()
            .trim();


    /* Explicit language */

    if (requested) {

        if (
            requested === "playwright"
        ) {

            return "Playwright";

        }


        if (
            requested === "javascript" ||
            requested === "js"
        ) {

            return "JavaScript";

        }


        if (
            requested === "typescript" ||
            requested === "ts"
        ) {

            return "TypeScript";

        }


        if (
            requested === "python" ||
            requested === "py"
        ) {

            return "Python";

        }


        if (
            requested === "java"
        ) {

            return "Java";

        }


        if (
            requested === "html"
        ) {

            return "HTML";

        }


        if (
            requested === "css"
        ) {

            return "CSS";

        }


        if (
            requested === "json"
        ) {

            return "JSON";

        }


        if (
            requested === "sql"
        ) {

            return "SQL";

        }

    }


    /* =================================================
       PLAYWRIGHT
    ================================================== */

    const playwrightPatterns = [

        /\bpage\.(goto|click|fill|locator|reload|waitFor|screenshot|getBy)/i,

        /\bpage\.getBy(Role|Text|Label|Placeholder|TestId)/i,

        /\bgetByRole\s*\(/i,

        /\bgetByText\s*\(/i,

        /\bgetByLabel\s*\(/i,

        /\bgetByPlaceholder\s*\(/i,

        /\bgetByTestId\s*\(/i,

        /\bexpect\s*\(/i,

        /\btest\s*\(\s*['"`]/i,

        /\bchromium\./i,

        /\bfirefox\./i,

        /\bwebkit\./i,

        /\bbrowser\./i,

        /\bplaywright\b/i,

        /@playwright\/test/i

    ];


    if (
        playwrightPatterns.some(
            pattern =>
                pattern.test(text)
        )
    ) {

        return "Playwright";

    }


    /* =================================================
       TYPESCRIPT
    ================================================== */

    if (

        /\binterface\s+\w+/i.test(text) ||

        /\btype\s+\w+\s*=/i.test(text) ||

        /\b(let|const|var)\s+\w+\s*:\s*(string|number|boolean)/i.test(text)

    ) {

        return "TypeScript";

    }


    /* =================================================
       PYTHON
    ================================================== */

    if (

        /\bdef\s+\w+\s*\(/i.test(text) ||

        /\bfrom\s+\w+\s+import\s+/i.test(text) ||

        /\bprint\s*\(/i.test(text)

    ) {

        return "Python";

    }


    /* =================================================
       JAVA
    ================================================== */

    if (

        /\bpublic\s+class\s+\w+/i.test(text) ||

        /\bpublic\s+static\s+void\s+main/i.test(text)

    ) {

        return "Java";

    }


    /* =================================================
       HTML
    ================================================== */

    if (

        /<!DOCTYPE\s+html>/i.test(text) ||

        /<html[\s>]/i.test(text) ||

        /<div[\s>]/i.test(text)

    ) {

        return "HTML";

    }


    /* =================================================
       CSS
    ================================================== */

    if (

        /[.#]?[a-zA-Z0-9_-]+\s*\{[\s\S]*\}/.test(text) &&

        /:\s*[^;]+;/.test(text)

    ) {

        return "CSS";

    }


    /* =================================================
       JSON
    ================================================== */

    if (

        (
            text.startsWith("{") &&
            text.endsWith("}")
        ) ||

        (
            text.startsWith("[") &&
            text.endsWith("]")
        )

    ) {

        try {

            JSON.parse(text);

            return "JSON";

        }

        catch {

            // Not JSON

        }

    }


    /* =================================================
       SQL
    ================================================== */

    if (

        /\b(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP)\b/i.test(text)

    ) {

        return "SQL";

    }


    /* =================================================
       JAVASCRIPT
    ================================================== */

    if (

        /\b(const|let|var)\s+\w+\s*=/i.test(text) ||

        /\bconsole\.log\s*\(/i.test(text) ||

        /=>/.test(text) ||

        /\basync\s+function\b/i.test(text) ||

        /\bawait\s+/i.test(text)

    ) {

        return "JavaScript";

    }


    /* =================================================
       UNKNOWN / PLAIN CODE
    ================================================== */

    return "Code";

}


/* =====================================================
   HIGHLIGHT.JS LANGUAGE
====================================================== */

function getHighlightLanguage(
    label
) {

    const map = {

        "Playwright":
            "javascript",

        "JavaScript":
            "javascript",

        "TypeScript":
            "typescript",

        "Python":
            "python",

        "Java":
            "java",

        "HTML":
            "xml",

        "CSS":
            "css",

        "JSON":
            "json",

        "SQL":
            "sql",

        "Code":
            "plaintext"

    };


    return (
        map[label] ||
        "plaintext"
    );

}


/* =====================================================
   CREATE CODE BLOCK
====================================================== */

function createCodeBlock(
    codeText,
    requestedLanguage = ""
) {

    const codeContainer =
        document.createElement(
            "div"
        );


    codeContainer.className =
        "code-container";


    const language =
        detectLanguage(
            codeText,
            requestedLanguage
        );


    const codeHeader =
        document.createElement(
            "div"
        );


    codeHeader.className =
        "code-header";


    const codeIcon =
        document.createElement(
            "span"
        );


    codeIcon.className =
        "code-icon";


    codeIcon.textContent =
        "</>";


    const codeLanguage =
        document.createElement(
            "span"
        );


    codeLanguage.className =
        "code-language";


    codeLanguage.textContent =
        language;


    codeHeader.appendChild(
        codeIcon
    );


    codeHeader.appendChild(
        codeLanguage
    );


    const pre =
        document.createElement(
            "pre"
        );


    const code =
        document.createElement(
            "code"
        );


    const highlightLanguage =
        getHighlightLanguage(
            language
        );


    code.className =
        `language-${highlightLanguage}`;


    code.textContent =
        codeText;


    pre.appendChild(
        code
    );


    codeContainer.appendChild(
        codeHeader
    );


    codeContainer.appendChild(
        pre
    );


    if (
        highlightLanguage !==
        "plaintext"
    ) {

        hljs.highlightElement(
            code
        );

    }


    return codeContainer;

}


/* =====================================================
   TIMESTAMP
====================================================== */

function getTimestamp() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    const hours =
        String(
            now.getHours()
        ).padStart(2, "0");


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    return (
        `${year}-${month}-${day}_` +
        `${hours}-${minutes}-${seconds}`
    );

}

function showDownloadProgress(

/* =====================================================
   UPDATE PROGRESS
====================================================== */

function updateDownloadProgress(
    percent,
    status
) {

    const safePercent =
        Math.min(
            100,
            Math.max(
                0,
                Math.round(percent)
            )
        );


    document.getElementById(
        "progressBar"
    ).style.width =
        safePercent + "%";


    document.getElementById(
        "progressPercent"
    ).textContent =
        safePercent + "%";


    if (status) {

        document.getElementById(
            "progressStatus"
        ).textContent =
            status;

    }

}

   HIDE PROGRESS
====================================================== */

function hideDownloadProgress(

) {

        );

}

   DOWNLOAD BUTTON STATE
====================================================== */

function setDownloadButtons(

/* =====================================================
   SAVE DRAFT
====================================================== */

function saveDraft() {

    const cards =
        document.querySelectorAll(
            "#groups .card"
        );


    const draft = [];


    cards.forEach(
        card => {

            const inputs =
                card.querySelectorAll(
                    "input, textarea"
                );


            draft.push({

                question:
                    inputs[0].value,

                answer:
                    inputs[1].value,

                code:
                    inputs[2].value

            });

        }
    );


    localStorage.setItem(
        "qaDraft",
        JSON.stringify(
            draft
        )
    );

}


/* =====================================================
   ADD QUESTION
====================================================== */

function addGroup(
    data = {}
) {

    questionCount++;


    const group =
        document.createElement(
            "div"
        );


    group.className =
        "card";


    group.innerHTML = `

        <button
            class="cancel-btn"
            title="Delete Question"
        >
            ✖
        </button>

        <div class="title">
            Question ${questionCount}
        </div>

        <input
            type="text"
            placeholder="Enter Question"
        >

        <textarea
            placeholder="Enter Answer"
        ></textarea>

        <textarea
            placeholder="Enter Example Code"
        ></textarea>

    `;


    const inputs =
        group.querySelectorAll(
            "input, textarea"
        );


    inputs[0].value =
        data.question || "";


    inputs[1].value =
        data.answer || "";


    inputs[2].value =
        data.code || "";


    group
        .querySelector(
            ".cancel-btn"
        )
        .onclick =
        function () {

            group.remove();

            updateTitles();

            saveDraft();

        };


    group
        .querySelectorAll(
            "input, textarea"
        )
        .forEach(
            element => {

                element.addEventListener(
                    "input",
                    saveDraft
                );

            }
        );


    document
        .getElementById(
            "groups"
        )
        .appendChild(
            group
        );

}


/* =====================================================
   UPDATE TITLES
====================================================== */

function updateTitles() {

    const cards =
        document.querySelectorAll(
            "#groups .card"
        );


    questionCount = 0;


    cards.forEach(
        card => {

            questionCount++;


            card
                .querySelector(
                    ".title"
                )
                .textContent =
                "Question " +
                questionCount;

        }

}


/* =====================================================
   JSON UPLOAD
====================================================== */

document
    .getElementById(
        "jsonUpload"
    )
    .addEventListener(
        "change",
        function (event) {

            const file =
                event.target.files[0];


            if (!file) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                function (e) {

                    try {

                        const data =
                            JSON.parse(
                                e.target.result
                            );


                        if (
                            !Array.isArray(
                                data
                            )
                        ) {

                            alert(
                                "Invalid JSON format.\n\nExpected a JSON array."
                            );

                            return;

                        }


                        document
                            .getElementById(
                                "groups"
                            )
                            .innerHTML =
                            "";


                        questionCount =
                            0;


                        data.forEach(
                            item => {

                                addGroup({

                                    question:
                                        item.question || "",

                                    answer:
                                        item.answer || "",

                                    code:
                                        item.code || ""

                                });

                            }
                        );


                        saveDraft();

                    }

                    catch (error) {

                        console.error(
                            error
                        );


                        alert(
                            "Invalid JSON file."
                        );

                    }

                };


            reader.readAsText(
                file
            );

        }
    );


/* =====================================================
   SUBMIT
====================================================== */

function submitData() {

    const cards =
        document.querySelectorAll(
            "#groups .card"
        );


    finalData = [];


    cards.forEach(
        card => {

            const inputs =
                card.querySelectorAll(
                    "input, textarea"
                );


            const question =
                inputs[0]
                    .value
                    .trim();


            const answer =
                inputs[1]
                    .value
                    .trim();


            const code =
                inputs[2]
                    .value
                    .trim();


            if (
                question !== ""
            ) {

                const obj = {

                    number:
                        finalData.length + 1,

                    question:
                        question,

                    answer:
                        answer

                };


                if (
                    code !== ""
                ) {

                    obj.code =
                        code;

                }


                finalData.push(
                    obj
                );

            }

        }
    );


    if (
        finalData.length === 0
    ) {

        alert(
            "Please enter at least one question."
        );

        return;

    }


    displayResults();

}


/* =====================================================
   DISPLAY RESULTS
====================================================== */

function displayResults() {

    const output =
        document.getElementById(
            "output"
        );


    output.innerHTML =
        "";


    finalData.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "title";


            title.textContent =
                item.number +
                ". " +
                item.question;


            card.appendChild(
                title
            );


            const answer =
                document.createElement(
                    "div"
                );


            answer.className =
                "answer-text";


            answer.textContent =
                item.answer;


            card.appendChild(
                answer
            );


            if (
                item.code
            ) {

                card.appendChild(
                    createCodeBlock(
                        item.code
                    )
                );

            }


            output.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   DOWNLOAD JSON
====================================================== */

async function downloadJSON() {

    if (
        finalData.length === 0
    ) {

        alert(
            "Please submit the Q&A before downloading JSON."
        );

        return;

    }


    const filename =
        "QA_Data_" +
        getTimestamp() +
        ".json";


    showDownloadProgress(
        "Preparing JSON...",
        filename
    );


    setDownloadButtons(
        true
    );


    try {

        updateDownloadProgress(
            20,
            "Preparing Q&A data..."
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    150
                )
        );


        updateDownloadProgress(
            50,
            "Creating JSON file..."
        );


        const json =
            JSON.stringify(
                finalData,
                null,
                2
            );


        const blob =
            new Blob(
                [json],
                {
                    type:
                        "application/json"
                }
            );


        updateDownloadProgress(
            80,
            "Preparing download..."
        );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            filename;


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );


        updateDownloadProgress(
            100,
            "Download started."
        );


        hideDownloadProgress(
            true
        );

    }

    catch (error) {

        console.error(
            "JSON download error:",
            error
        );


        hideDownloadProgress(
            false
        );


        alert(
            "Failed to download JSON file."
        );

    }

    finally {

        setDownloadButtons(
            false
        );

    }

}


/* =====================================================
   DOWNLOAD PDF
====================================================== */

async function downloadPDF() {

    if (
        finalData.length === 0
    ) {

        alert(
            "Please submit the Q&A before downloading the PDF."
        );

        return;

    }


    const filename =
        "QA_Report_" +
        getTimestamp() +
        ".pdf";


    showDownloadProgress(
        "Preparing PDF...",
        filename
    );


    setDownloadButtons(
        true
    );


    try {

        const { jsPDF } =
            window.jspdf;


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            210;


        const pageHeight =
            297;


        const margin =
            10;


        const usableWidth =
            pageWidth -
            margin * 2;


        const usableHeight =
            pageHeight -
            margin * 2;


        let currentY =
            margin;


        const total =
            finalData.length;


        for (
            let i = 0;
            i < total;
            i++
        ) {

            const item =
                finalData[i];


            updateDownloadProgress(

                10 +
                (i / total) * 85,

                `Generating question ${i + 1} of ${total}...`

            );


            const pdfCard =
                document.createElement(
                    "div"
                );


            pdfCard.className =
                "pdf-card";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "pdf-title";


            title.textContent =
                item.number +
                ". " +
                item.question;


            pdfCard.appendChild(
                title
            );


            const answer =
                document.createElement(
                    "div"
                );


            answer.className =
                "pdf-answer";


            answer.textContent =
                item.answer;


            pdfCard.appendChild(
                answer
            );


            if (
                item.code
            ) {

                pdfCard.appendChild(
                    createCodeBlock(
                        item.code
                    )
                );

            }


            const pdfContainer =
                document.getElementById(
                    "pdfContainer"
                );


            pdfContainer.innerHTML =
                "";


            pdfContainer.appendChild(
                pdfCard
            );


            await new Promise(
                resolve =>
                    requestAnimationFrame(
                        resolve
                    )
            );


            const canvas =
                await html2canvas(
                    pdfCard,
                    {

                        scale: 2,

                        useCORS: true,

                        backgroundColor:
                            "#ffffff",

                        logging: false

                    }
                );


            const imgData =
                canvas.toDataURL(
                    "image/png"
                );


            const imgWidth =
                usableWidth;


            const imgHeight =
                canvas.height *
                imgWidth /
                canvas.width;


            if (
                imgHeight <=
                usableHeight
            ) {

                if (
                    currentY +
                    imgHeight >
                    pageHeight -
                    margin
                ) {

                    pdf.addPage();

                    currentY =
                        margin;

                }


                pdf.addImage(

                    imgData,

                    "PNG",

                    margin,

                    currentY,

                    imgWidth,

                    imgHeight

                );


                currentY +=
                    imgHeight + 5;

            }

            else {

                if (
                    currentY !==
                    margin
                ) {

                    pdf.addPage();

                }


                currentY =
                    margin;


                const scale =
                    usableHeight /
                    imgHeight;


                const scaledWidth =
                    imgWidth *
                    scale;


                const centeredX =
                    (
                        pageWidth -
                        scaledWidth
                    ) / 2;


                pdf.addImage(

                    imgData,

                    "PNG",

                    centeredX,

                    margin,

                    scaledWidth,

                    usableHeight

                );


                if (
                    i <
                    total - 1
                ) {

                    pdf.addPage();

                }


                currentY =
                    margin;

            }


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        10
                    )
            );

        }


        updateDownloadProgress(
            95,
            "Finalizing PDF..."
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    100
                )
        );


        pdf.save(
            filename
        );


        updateDownloadProgress(
            100,
            "Download started."
        );


        hideDownloadProgress(
            true
        );

    }

    catch (error) {

        console.error(
            "PDF download error:",
            error
        );


        hideDownloadProgress(
            false
        );


        alert(
            "Failed to generate PDF.\n\n" +
            error.message
        );

    }

    finally {

        setDownloadButtons(
            false
        );

    }

}


/* =====================================================
   GET HISTORY
====================================================== */

function getHistory() {

    try {

        const history =
            localStorage.getItem(
                HISTORY_KEY
            );


        if (!history) {

            return [];

        }


        const parsed =
            JSON.parse(
                history
            );


        return Array.isArray(parsed)
            ? parsed
            : [];

    }

    catch (error) {

        console.error(
            "History read error:",
            error
        );


        return [];

    }

}


/* =====================================================
   SAVE CURRENT Q&A TO HISTORY
====================================================== */

function saveCurrentToHistory() {

    const cards =
        document.querySelectorAll(
            "#groups .card"
        );


    const data = [];


    cards.forEach(
        card => {

            const inputs =
                card.querySelectorAll(
                    "input, textarea"
                );


            const question =
                inputs[0]
                    .value
                    .trim();


            const answer =
                inputs[1]
                    .value
                    .trim();


            const code =
                inputs[2]
                    .value
                    .trim();


            if (
                question !== "" ||
                answer !== "" ||
                code !== ""
            ) {

                data.push({

                    question:
                        question,

                    answer:
                        answer,

                    code:
                        code

                });

            }

        }
    );


    if (
        data.length === 0
    ) {

        return false;

    }


    const history =
        getHistory();


    const historyItem = {

        id:
            Date.now(),

        date:
            new Date().toISOString(),

        questionCount:
            data.length,

        data:
            data

    };


    history.unshift(
        historyItem
    );


    /* Keep latest 20 */

    const limitedHistory =
        history.slice(
            0,
            20
        );


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            limitedHistory
        )
    );


    /* NEW: refresh sidebar Recents */

    renderSidebar();


    return true;

}


/* =====================================================
   FORMAT HISTORY DATE
====================================================== */

function formatHistoryDate(
    dateString
) {

    const date =
        new Date(
            dateString
        );


    return date.toLocaleString(
        "en-IN",
        {

            day: "2-digit",

            month: "short",

            year: "numeric",

            hour: "2-digit",

            minute: "2-digit"

        }
    );

}


/* =====================================================
   OPEN HISTORY
====================================================== */

function openHistory() {

    renderHistory();


    document
        .getElementById(
            "historyOverlay"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   CLOSE HISTORY
====================================================== */

function closeHistory() {

    document
        .getElementById(
            "historyOverlay"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   RENDER HISTORY
====================================================== */

function renderHistory() {

    const historyList =
        document.getElementById(
            "historyList"
        );


    const history =
        getHistory();


    historyList.innerHTML =
        "";


    if (
        history.length === 0
    ) {

        historyList.innerHTML = `

            <div class="history-empty">

                No history available yet.

                <br><br>

                Your Q&A will automatically be
                saved here when you use
                Clear / Restart.

            </div>

        `;

        return;

    }


    history.forEach(
        (item, index) => {

            const historyItem =
                document.createElement(
                    "div"
                );


            historyItem.className =
                "history-item";


            historyItem.innerHTML = `

                <div
                    class="history-item-title"
                >
                    📄 Q&A Session ${history.length - index}
                </div>


                <div
                    class="history-item-info"
                >
                    ${item.questionCount}
                    Question(s)
                    •
                    ${formatHistoryDate(item.date)}
                </div>


                <div
                    class="history-actions"
                >

                    <button
                        class="history-restore"
                        onclick="restoreHistory(${item.id})"
                    >
                        ↩ Restore
                    </button>


                    <button
                        class="history-delete"
                        onclick="deleteHistory(${item.id})"
                    >
                        🗑 Delete
                    </button>

                </div>

            `;


            historyList.appendChild(
                historyItem
            );

        }
    );

}


/* =====================================================
   RESTORE HISTORY
====================================================== */

async function restoreHistory(
    historyId
) {

    const history =
        getHistory();


    const item =
        history.find(
            entry =>
                entry.id ===
                historyId
        );


    if (!item) {

        alert(
            "History record not found."
        );

        return;

    }


    const confirmed =
        await customConfirm({

            icon: "↩️",

            title: "Restore this Q&A session?",

            message:
                "Your current workspace will be replaced.",

            confirmText: "Restore"

        });


    if (!confirmed) {

        return;

    }


    document
        .getElementById(
            "groups"
        )
        .innerHTML =
        "";


    questionCount =
        0;


    item.data.forEach(
        data => {

            addGroup(
                data
            );

        }
    );


    document
        .getElementById(
            "output"
        )
        .innerHTML =
        "";


    finalData =
        [];


    saveDraft();


    closeHistory();


    if (
        window.innerWidth <= 800
    ) {

        document.body.classList.add(
            "sidebar-closed"
        );

    }


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* =====================================================
   DELETE HISTORY
====================================================== */

async function deleteHistory(
    historyId
) {

    const confirmed =
        await customConfirm({

            icon: "🗑️",

            title: "Delete this history?",

            message:
                "This Q&A session will be permanently " +
                "removed from History.",

            confirmText: "Delete"

        });


    if (!confirmed) {

        return;

    }


    let history =
        getHistory();


    history =
        history.filter(
            item =>
                item.id !==
                historyId
        );


    localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
            history
        )
    );


    renderHistory();


    /* NEW: refresh sidebar Recents */

    renderSidebar();

}


/* =====================================================
   OPEN RESTART POPUP
====================================================== */

function openRestartPopup() {

    document
        .getElementById(
            "restartOverlay"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   CLOSE RESTART POPUP
====================================================== */

function closeRestartPopup() {

    document
        .getElementById(
            "restartOverlay"
        )
        .classList.remove(
            "show"
        );

}


/* =====================================================
   CONFIRM RESTART
====================================================== */

function confirmRestart() {

    /*
       Save current Q&A first.
    */

    const savedToHistory =
        saveCurrentToHistory();


    /*
       Clear current draft.
    */

    localStorage.removeItem(
        "qaDraft"
    );


    /*
       Clear questions.
    */

    document
        .getElementById(
            "groups"
        )
        .innerHTML =
        "";


    /*
       Clear submitted Q&A.
    */

    document
        .getElementById(
            "output"
        )
        .innerHTML =
        "";


    /*
       Reset variables.
    */

    questionCount =
        0;


    finalData =
        [];


    /*
       Reset JSON input.
    */

    document
        .getElementById(
            "jsonUpload"
        )
        .value =
        "";


    /*
       Create fresh Question 1.
    */

    addGroup();


    /*
       Close popup.
    */

    closeRestartPopup();


    /*
       Show result.
    */

    if (
        savedToHistory
    ) {

        alert(
            "Current Q&A has been saved to History.\n\n" +
            "A fresh Q&A session has been started."
        );

    }

    else {

        alert(
            "Workspace cleared.\n\n" +
            "A fresh Q&A session has been started."
        );

    }

}


/* =====================================================
   CLOSE RESTART POPUP OUTSIDE CLICK
====================================================== */

document
    .getElementById(
        "restartOverlay"
    )
    .addEventListener(
        "click",
        function (event) {

            if (
                event.target ===

            ) {

        }
    );


/* =====================================================
   CLOSE HISTORY OUTSIDE CLICK
====================================================== */

document
    .getElementById(
        "historyOverlay"
    )
    .addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                this
            ) {

                closeHistory();

            }

        }
    );


/* =====================================================
   ESC KEY
====================================================== */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeRestartPopup();

            closeHistory();

        }

    }
);


/* =====================================================
   CONFIRM POPUP (NEW)
====================================================== */

let confirmResolver = null;


function customConfirm(options) {

    return new Promise(
        function (resolve) {

            confirmResolver =
                resolve;


            document.getElementById(
                "confirmIcon"
            ).textContent =
                options.icon || "⚠️";


            document.getElementById(
                "confirmTitle"
            ).textContent =
                options.title || "Are you sure?";


            document.getElementById(
                "confirmMessage"
            ).textContent =
                options.message || "";


            document.getElementById(
                "confirmOk"
            ).textContent =
                options.confirmText || "Confirm";


            document
                .getElementById(
                    "confirmOverlay"
                )
                .classList.add(
                    "show"
                );

        }
    );

}


function resolveConfirm(result) {

    document
        .getElementById(
            "confirmOverlay"
        )
        .classList.remove(
            "show"
        );


    if (confirmResolver) {

        const resolver =
            confirmResolver;

        confirmResolver =
            null;

        resolver(result);

    }

}


document
    .getElementById(
        "confirmOverlay"
    )
    .addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                this
            ) {

                resolveConfirm(false);

            }

        }
    );


document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Escape"
        ) {

            resolveConfirm(false);

        }

    }
);


/* =====================================================
   SIDEBAR (NEW) - TOGGLE
====================================================== */

function toggleSidebar() {

    document.body.classList.toggle(
        "sidebar-closed"
    );

}


/* =====================================================
   SIDEBAR (NEW) - RENDER RECENTS
====================================================== */

function renderSidebar() {

    const list =
        document.getElementById(
            "sidebarList"
        );


    const history =
        getHistory();


    list.innerHTML =
        "";


    if (
        history.length === 0
    ) {

        list.innerHTML = `

            <div class="sidebar-empty">
                No recent Q&A yet.
                Use "New chat" to save
                your current Q&A here.
            </div>

        `;

        return;

    }


    history.forEach(
        item => {

            const first =
                item.data &&
                item.data[0]
                    ? (
                        item.data[0].question ||
                        item.data[0].answer ||
                        "Untitled Q&A"
                    )
                    : "Untitled Q&A";


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "sidebar-item";


            row.title =
                first;


            const title =
                document.createElement(
                    "span"
                );


            title.className =
                "sidebar-item-title";


            title.textContent =
                first;


            const del =
                document.createElement(
                    "button"
                );


            del.className =
                "sidebar-item-delete";


            del.title =
                "Delete";


            del.textContent =
                "🗑";


            del.onclick =
                function (event) {

                    event.stopPropagation();

                    deleteHistory(
                        item.id
                    );

                };


            row.onclick =
                function () {

                    restoreHistory(
                        item.id
                    );

                };


            row.appendChild(
                title
            );


            row.appendChild(
                del
            );


            list.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   LOAD SAVED DRAFT
====================================================== */

window.onload =
    function () {

        /* NEW: sidebar initial state */

        if (
            window.innerWidth <= 800
        ) {

            document.body.classList.add(
                "sidebar-closed"
            );

        }


        renderSidebar();


        const saved =
            localStorage.getItem(
                "qaDraft"
            );


        if (saved) {

            try {

                const draft =
                    JSON.parse(
                        saved
                    );


                if (
                    Array.isArray(draft) &&
                    draft.length > 0
                ) {

                    draft.forEach(
                        item => {

                            addGroup(
                                item
                            );

                        }
                    );

                }

                else {

                    addGroup();

                }

            }

            catch (error) {

                console.error(
                    "Draft loading error:",
                    error
                );


                addGroup();

            }

        }

        else {

            addGroup();

        }

    };

</script>
